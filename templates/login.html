<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================= BODY ================= */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }


        /* ================= LIGHT THEME ================= */

        body.light {
            background-color: #f5f5f5;
            color: #222;
        }

        body.light .login-container {
            background-color: white;
            color: #222;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body.light input[type="text"],
        body.light input[type="password"] {
            background-color: white;
            color: #222;
            border: 1px solid #bbb;
        }


        /* ================= DARK THEME ================= */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .login-container {
            background-color: #1e1e1e;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: #ddd;
        }

        body.dark input[type="text"],
        body.dark input[type="password"] {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder {
            color: #aaa;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            padding: 35px;
            border-radius: 10px;
            transition: background-color 0.3s, color 0.3s;
        }


        /* ================= LOGIN HEADING ================= */

        h1 {
            text-align: center;
            color: #222;
            font-size: 28px;
            margin-bottom: 30px;
        }


        /* ================= THEME BUTTONS ================= */

        .theme-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .theme-buttons a {
            color: #00bcd4;
            text-decoration: none;
            border: 1px solid #00bcd4;
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 13px;
            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background-color: #00bcd4;
            color: white;
        }


        /* ================= LOGIN FORM ================= */

        form {
            width: 100%;
            padding: 30px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        body.dark form {
            background-color: #1e1e1e;
            border-color: #444;
            box-shadow: none;
        }


        /* ================= FORM GROUP ================= */

        .form-group {
            margin-bottom: 20px;
        }


        /* ================= LABELS ================= */

        label {
            display: block;
            margin-bottom: 8px;
            color: #222;
            font-weight: bold;
        }


        /* ================= INPUT BOXES ================= */

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
        }


        /* ================= INPUT FOCUS ================= */

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00bcd4;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 188, 212, 0.3);
        }


        /* ================= LOGIN BUTTON ================= */

        input[type="submit"] {
            display: block;
            width: auto;
            margin: 10px auto 0;
            padding: 12px 35px;
            background-color: #222;
            color: white;
            border: 1px solid #00bcd4;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #00bcd4;
            color: white;
        }

        input[type="submit"]:active {
            transform: scale(0.97);
        }


        /* ================= REGISTER LINK ================= */

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #00bcd4;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }


        /* ================= HOME LINK ================= */

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #00bcd4;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            text-decoration: underline;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .login-container {
                width: 95%;
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            form {
                padding: 25px;
            }
        }

    </style>

</head>


<body class="{{ theme }}">

    <div class="login-container">


        <!--THEME BUTTONS -->

        <div class="theme-buttons">

            <a href="/set-theme/light">
                ☀ Light
            </a>

            <a href="/set-theme/dark">
                🌙 Dark
            </a>

        </div>

        <!--  LOGIN HEADING -->

        <h1>Login page</h1>

        {% if error %}
    <p style="color: red; text-align: center;">{{ error }}</p>
{% endif %}

        <!--  LOGIN FORM  -->

        <form action="/login" method="POST">

            <!-- Username -->

            <label for="username">Username:</label>

            <input id="username" type="text" name="username" placeholder="Enter your username" required >

            <!-- Password -->

            <label for="password"> Password:</label>

            <input id="password" type="password" name="password" placeholder="Enter your password" required>

            <!-- Login Button -->

            <input type="submit" value="Login">

        </form>

        <!-- ================= REGISTER ================= -->

        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>


    </div>

</body>

</html>
