<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>

    /* Background of the whole page */
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }

    /* Login heading */
    h1 {
        text-align: center;
        color: #222;
        font-size: 28px;
        margin-top: 50px;
        margin-bottom: 30px;
    }

    /* Login form */
    form {
        width: 400px;
        margin: 0 auto;
        padding: 30px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* Labels */
    label {
        display: block;
        margin-bottom: 8px;
        color: #222;
        font-weight: bold;
    }

    /* Input boxes */
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        box-sizing: border-box;
        border: 1px solid #bbb;
        border-radius: 5px;
        font-size: 14px;
        background-color: white;
    }

    /* Input when selected */
    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #00bcd4;
        outline: none;
        box-shadow: 0 0 5px rgba(0, 188, 212, 0.3);
    }

    /* Login button */
    input[type="submit"] {
        display: block;
        width: auto;
        margin: 10px auto 0;
        padding: 12px 35px;
        background-color: #222;
        color: white;
        border: 1px solid #00bcd4;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    /* Login button hover */
    input[type="submit"]:hover {
        background-color: #00bcd4;
        color: white;
    }

    /* Login button click */
    input[type="submit"]:active {
        transform: scale(0.97);
    }

    </style>

</head>

<body>
    <h1>Login page</h1>

    <form action="/login" method="POST">

    <label>Username:</label>
    <input id="username" type="text"  placeholder="Enter your username" name="username" required >
    <br><br>

    <label>Password:</label>
    <input id="password" type="password" placeholder="Enter your password" name="password" required>
    <br><br>

    <input type="submit" value="login">
    <br></br>
    
    </form>
</body>
</html>
