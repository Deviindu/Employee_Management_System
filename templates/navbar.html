<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>

        *{
            margin:0;
            Padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:Arial, sans-serif;
        }
        /*Navbar*/
        .navbar{
            background-color:#222;
            padding: 15px 30px;
            display:flex;
            align-items: center;
        }
        .logo {  
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
            white-space: nowrap;
        }
        /*Navigation links*/
        .nav-links{
            display: flex;
            align-items:center;
            list-style:none;
            gap:20px;
        }
         .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        .nav-links a:hover{
            color:#00bcd4;
        }
        /*login button*/
        .login-btn{
            border:1px solid #00bcd4;
            padding:8px 15px;
            border-radius:5px;
        }
        .login-btn:hover{
            background-color:#00bcd4;
            color:white!important;
        }
        /*Register button*/
        .register-btn{
            background-color:#00bcd4;
            padding:8px 15px;
            border-radius: 5px;
        }
        .register-btn:hover{
            background-color: #0097a7;
            color:white!important;
        }
        /* Content */
        .content {
            padding: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
 
    <nav class="navbar">
        <div class="logo">
            Employee Management System
        </div>
        <ul class="nav-links">
            <li>
                <a href="/home">
                Home
                </a>
            </li>
            <li>
                <a href="/employees">
                Employees
                </a>
            </li>
            <li>
                <a href="/add-employee">
                Add Employee
                </a>
            </li>
            <li>
                <a href="/search" >
                Search
                </a>
            </li>
            <li>
                <a href="/login" class="login-btn">
                  Login
                </a>
            </li>
            <li>
                <a href="/register" class="register-btn">
                Register
                </a>
            </li>
        </ul>
    </nav>

    <div class="content">
    <h1>Welcome to Employee Management System</h1>
    <p>Manage your employees easily</p>

    </div>
</body>
</html>
