<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }


        /* =========================
           LIGHT THEME
        ========================= */

        body.light {
            background-color: #f5f5f5;
            color: #222;
        }

        body.light .register-container {
            background-color: white;
            color: #222;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body.light input[type="text"],
        body.light input[type="password"] {
            background-color: white;
            color: #222;
            border: 1px solid #ccc;
        }


        /* =========================
           DARK THEME
        ========================= */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .register-container {
            background-color: #1e1e1e;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: #ddd;
        }

        body.dark input[type="text"],
        body.dark input[type="password"] {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder {
            color: #aaa;
        }


        /* =========================
           REGISTER CONTAINER
        ========================= */

        .register-container {
            width: 420px;
            max-width: 90%;

            margin: 50px auto;
            padding: 35px;

            border-radius: 10px;

            transition:
                background-color 0.3s,
                color 0.3s;
        }


        /* =========================
           THEME BUTTONS
        ========================= */

        .theme-buttons {
            display: flex;
            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;
        }

        .theme-buttons a {
            color: #00bcd4;

            text-decoration: none;

            border: 1px solid #00bcd4;

            padding: 7px 12px;

            border-radius: 5px;

            font-size: 13px;

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background-color: #00bcd4;
            color: white;
        }


        /* =========================
           REGISTRATION HEADING
        ========================= */

        h1 {
            text-align: center;

            color: #222;

            font-size: 28px;

            margin-bottom: 30px;
        }


        /* =========================
           REGISTRATION FORM
        ========================= */

        form {
            width: 100%;

            padding: 30px;

            background-color: white;

            border: 1px solid #ddd;

            border-radius: 10px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        body.dark form {
            background-color: #1e1e1e;
            border-color: #444;
            box-shadow: none;
        }


        /* =========================
           LABELS
        ========================= */

        label {
            display: block;

            margin-bottom: 8px;

            color: #222;

            font-weight: bold;
        }


        /* =========================
           INPUT BOXES
        ========================= */

        input[type="text"],
        input[type="password"] {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #bbb;

            border-radius: 5px;

            font-size: 14px;
        }


        /* =========================
           INPUT FOCUS
        ========================= */

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00bcd4;

            outline: none;

            box-shadow: 0 0 5px rgba(0, 188, 212, 0.3);
        }


        /* =========================
           BUTTONS CONTAINER
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            margin-top: 10px;
        }


        /* =========================
           REGISTER & RESET BUTTONS
        ========================= */

        .buttons input[type="submit"],
        .buttons button {
            width: 140px;
            height: 45px;

            padding: 0;
            margin: 0;

            background-color: #222;

            color: white;

            border: 1px solid #00bcd4;

            border-radius: 5px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        /* =========================
           BUTTON HOVER
        ========================= */

        .buttons input[type="submit"]:hover,
        .buttons button:hover {
            background-color: #00bcd4;
            color: white;
        }


        /* =========================
           BUTTON ACTIVE
        ========================= */

        .buttons input[type="submit"]:active,
        .buttons button:active {
            transform: scale(0.97);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .login-link a {
            color: #00bcd4;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }


        /* =========================
           HOME LINK
        ========================= */

        .home-link {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #00bcd4;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            text-decoration: underline;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .register-container {
                width: 95%;
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            form {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            .buttons input[type="submit"],
            .buttons button {
                width: 100%;
            }
        }

    </style>
</head>


<body class="{{ theme }}">


    <!-- =========================
         REGISTER CONTAINER
    ========================= -->

    <div class="register-container">


        <!-- =========================
             THEME BUTTONS
        ========================= -->

        <div class="theme-buttons">

            <a href="/set-theme/light">
                ☀ Light
            </a>

            <a href="/set-theme/dark">
                🌙 Dark
            </a>

        </div>


        <!-- =========================
             REGISTRATION HEADING
        ========================= -->

        <h1>
            Employee Registration Form
        </h1>


        <!-- =========================
             REGISTRATION FORM
        ========================= -->

        <form
            id="registrationform"
            action="/register"
            method="POST"
        >


            <!-- FULL NAME -->

            <label for="fullname">
                Full Name:
            </label>

            <input
                id="fullname"
                type="text"
                name="fullname"
                placeholder="Enter your fullname"
                required
            >


            <!-- USERNAME -->

            <label for="username">
                Username:
            </label>

            <input
                id="username"
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password:
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <!-- =========================
                 REGISTER & RESET BUTTONS
            ========================= -->

            <div class="buttons">

                <input
                    type="submit"
                    value="Register"
                >

                <button
                    type="button"
                    onclick="resetForm()"
                >
                    Reset
                </button>

            </div>


            <!-- =========================
                 LOGIN LINK
            ========================= -->

            <div class="login-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>


            <!-- =========================
                 HOME LINK
            ========================= -->

            <a
                href="/"
                class="home-link"
            >
                ← Back to Home
            </a>


        </form>

    </div>


    <!-- =========================
         RESET FORM SCRIPT
    ========================= -->

    <script>

        function resetForm() {
            document
                .getElementById("registrationform")
                .reset();
        }

    </script>

</body>

</html>
