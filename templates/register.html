<!DOCTYPE html>
<html lang="en">  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <style>
    /* Background of the whole page */
     body {
        font-family: Arial, sans-serif; 
        background-color: #f2f2f2; 
        margin: 0; padding: 0; 
    }

    /* Registration heading */ 
    h1 { text-align: center; 
        color: #222; 
        font-size: 28px; 
        margin-top: 50px; 
        margin-bottom: 30px; 
    } 

    /* Registration form */ 
    form { 
        width: 400px;
        margin: 0 auto; 
        padding: 30px; 
        background-color: white; 
        border: 1px solid #ddd; 
        border-radius: 10px; 
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); 
        } 

    /* Labels */ 
    label { 
        display: block; 
        margin-bottom: 8px; 
        color: #222; 
        font-weight: bold; 
    } 

    /* Input boxes */ 
    input[type="text"], 
    input[type="password"] { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 20px; 
        box-sizing: border-box; 
        border: 1px solid #bbb; 
        border-radius: 5px; 
        font-size: 14px; 
        background-color: white; 
    } 

    /* Input when selected */ 
    input[type="text"]:focus, 
    input[type="password"]:focus { 
        border-color: #00bcd4; 
        outline: none; 
        box-shadow: 0 0 5px rgba(0, 188, 212, 0.3); 
    } 

    /* Buttons container */ 
    .buttons { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 15px; 
        margin-top: 10px; 
    } 

    /* Register and Reset buttons */ 
    .buttons input[type="submit"], 
    .buttons button { 
        width: 140px; 
        height: 45px; 
        padding: 0; 
        margin: 0; 
        box-sizing: border-box; 
        background-color: #222; 
        color: white; 
        border: 1px solid #00bcd4; 
        border-radius: 5px; 
        font-size: 16px; 
        font-weight: bold; 
        cursor: pointer; 
    }

    /* Button hover */ 
    .buttons input[type="submit"]:hover, 
    .buttons button:hover { 
        background-color: #00bcd4; 
        color: white; 
    } 

    /* Button click */ 
    .buttons input[type="submit"]:active, 
    .buttons button:active {
        transform: scale(0.97); 
    }

    </style>
</head>

<body>    
    <h1>Employee Registration form</h1>                             
    <form id="registrationform" action="/register" method="POST">
        <label>Full name:</label>
        <input id="fullname" type="text" placeholder="Enter your fullname" name="fullname" required>
        <br><br>

        <label>Username:</label>
        <input id="username" type="text" placeholder="Enter your username" name="username" required>
        <br><br>

        <label>Password:</label>
        <input  id="password" type="password" placeholder="Enter your password" name="password" required>
        <br><br>

        <div class="buttons">
        <input type="submit" value="Register">
        <button type="button" onclick="resetForm()">Reset</button>
        </div>

        <script>
            function resetForm(){
                document.getElementById("registrationform").reset();
            }
        </script>
    </form>
</body>
</html>
